apiVersion: v1
data:
  peer.yaml: "# daemon alive time, when sets 0s, daemon will not auto exit\n# it is
    useful for longtime running\naliveTime: 0s\n\n# daemon gc task running interval\ngcInterval:
    1m0s\n\n# WorkHome is working directory.\n# In linux, default value is /usr/local/dragonfly.\n#
    In macos(just for testing), default value is /Users/$USER/.dragonfly.\n# NOTE(tommylikehu):
    Manager对应的磁盘操作根目录，默认放在挂载的磁盘中,假定挂载Disk在/data2目录, 所有的子目录均挂载在这个目录下。\nworkHome: '/data2/peer/dragonfly'\n\n#
    logDir is the log directory.\n# In linux, default value is /var/log/dragonfly.\n#
    In macos(just for testing), default value is /Users/$USER/.dragonfly/logs.\nlogDir:
    '/data2/peer/dragonfly/logs'\n\n# cacheDir is dynconfig cache directory.\n# In
    linux, default value is /var/cache/dragonfly.\n# In macos(just for testing), default
    value is /Users/$USER/.dragonfly/cache.\ncacheDir: '/data2/peer/dragonfly/cache'\n\n#
    pluginDir is the plugin directory.\n# In linux, default value is /usr/local/dragonfly/plugins.\n#
    In macos(just for testing), default value is /Users/$USER/.dragonfly/plugins.\npluginDir:
    '/data2/peer/dragonfly/plugins'\n\n# dataDir is the download data directory.\n#
    In linux, default value is /var/lib/dragonfly.\n# In macos(just for testing),
    default value is /Users/$USER/.dragonfly/data.\ndataDir: '/data2/peer/dragonfly/data'\n\n#
    when daemon exit, keep peer task data or not\n# it is usefully when upgrade daemon
    service, all local cache will be saved\n# default is false\nkeepStorage: true\n\n#
    console shows log on console\nconsole: false\n\n# whether to enable debug level
    logger and enable pprof\nverbose: true\n\n# listen port for pprof, only valid
    when the verbose option is true\n# default is -1. If it is 0, pprof will use a
    random port.\npprof-port: -1\n\n# jaeger endpoint url, like: http://jaeger.dragonfly.svc:14268/api/traces\njaeger:
    \"\"\n\n# all addresses of all schedulers\n# the schedulers of all daemons should
    be same in one region or zone.\n# daemon will send tasks to a fixed scheduler
    by hashing the task url and meta data\n# caution: only tcp is supported\nscheduler:\n
    \ manager:\n    # get scheduler list dynamically from manager\n    enable: true\n
    \   netAddrs:\n        # NOTE(tommylikehu): 需要指向manager对应的elb的service名，端口保持一致。\n
    \     - type: tcp\n        addr: 172.21.0.134:65003\n        # scheduler list
    refresh interval\n        refreshInterval: 10s\n  # schedule timeout\n  scheduleTimeout:
    30s\n  # when true, only scheduler says back source, daemon can back source\n
    \ disableAutoBackSource: false\n  # below example is a stand address\n  # netAddrs:\n
    \ #   - type: tcp\n  #     addr: 192.168.215.1:8002\n\n# current host info used
    for scheduler\nhost:\n  # access ip for other peers\n  # when local ip is different
    with access ip, advertiseIP should be set\n  # NOTE(tommylikehu): 宿主机对应的IP地址，到时候seed
    peer会绑定宿主机的端口，因此也可以通过外部IP访问seed peer  \n  advertiseIP: _REPLACE_ME_WIATH_REAL_IP_ADDRESS_\n
    \ # Geographical location, separated by \"|\" characters.\n  # NOTE(tommylikehu):
    跟其他组件保持一致\n  location: 'huawei-guiyang'  \n  # IDC deployed by daemon.\n  idc:
    'china-guizhou'\n\n# download service option\ndownload:\n  concurrent:\n    #
    thresholdSize indicates the threshold to download pieces concurrently.\n    thresholdSize:
    10M\n    # thresholdSpeed indicates the threshold download speed to download pieces
    concurrently.\n    thresholdSpeed: 2M\n    # goroutineCount indicates the concurrent
    goroutine count for every task.\n    goroutineCount: 4\n    # initBackoff second
    for every piece failed, default: 0.5.\n    initBackoff: 0.5\n    # maxBackoff
    second for every piece failed, default: 3.\n    maxBackoff: 3\n    # maxAttempts
    for every piece failed,default: 3.\n    maxAttempts: 3\n  # calculate digest when
    transfer files, set false to save memory\n  calculateDigest: true\n  # total download
    limit per second\n  totalRateLimit: 1024Mi\n  # per peer task download limit per
    second\n  perPeerRateLimit: 512Mi\n  # traffic shaper type\n  trafficShaperType:
    sampling\n  # download piece timeout\n  pieceDownloadTimeout: 30s\n  # When request
    data with range header, prefetch data not in range.\n  prefetch: false\n  # golang
    transport option\n  transportOption:\n    # dial timeout\n    dialTimeout: 2s\n
    \   # keep alive\n    keepAlive: 30s\n    # same with http.Transport.MaxIdleConns\n
    \   maxIdleConns: 100\n    # same with http.Transport.IdleConnTimeout\n    idleConnTimeout:
    90s\n    # same with http.Transport.ResponseHeaderTimeout\n    responseHeaderTimeout:
    2s\n    # same with http.Transport.TLSHandshakeTimeout\n    tlsHandshakeTimeout:
    1s\n    # same with http.Transport.ExpectContinueTimeout\n    expectContinueTimeout:
    2s\n  # download grpc option\n  downloadGRPC:\n    # Security option.\n    security:\n
    \     insecure: true\n      cacert: ''\n      cert: ''\n      key: ''\n      tlsVerify:
    true\n      tlsConfig: null\n    # Download service listen address\n    # current,
    only support unix domain socket.\n    unixListen:\n      # In linux, default value
    is /var/run/dfdaemon.sock.\n      # In macos(just for testing), default value
    is /tmp/dfdaemon.sock.\n      socket: ''\n  # peer grpc option\n  # peer grpc
    service send pieces info to other peers\n  peerGRPC:\n    security:\n      insecure:
    true\n      cacert: ''\n      cert: ''\n      key: ''\n      tlsVerify: true\n
    \   tcpListen:\n      # # Listen address.\n      # listen: 0.0.0.0\n      # Listen
    port, daemon will try to listen,\n      # when this port is not available, daemon
    will try next port.\n      port: 65000\n      # If want to limit upper port, please
    use blow format.\n#     port:\n#       start: 65000\n#       end: 65009\n\n# upload
    service option\nupload:\n  # Upload limit per second.\n  rateLimit: 1024Mi\n  security:\n
    \   insecure: true\n    cacert: ''\n    cert: ''\n    key: ''\n    tlsVerify:
    false\n  tcpListen:\n    # # Listen address.\n    # listen: 0.0.0.0\n    # Listen
    port, daemon will try to listen,\n    # when this port is not available, daemon
    will try next port.\n    port: 65002\n    # If want to limit upper port, please
    use blow format.\n#   port:\n#     start: 65020\n#     end: 65029\n#\n# Object
    storage service.\nobjectStorage:\n  # Enable object storage service.\n  enable:
    false\n  # Filter is used to generate a unique Task ID by\n  # filtering unnecessary
    query params in the URL,\n  # it is separated by & character.\n  # When filter:
    \"Expires&Signature&ns\", for example:\n  #  http://localhost/xyz?Expires=111&Signature=222&ns=docker.io
    and http://localhost/xyz?Expires=333&Signature=999&ns=docker.io\n  # is same task.\n
    \ filter: 'Expires&Signature&ns'\n  # maxReplicas is the maximum number of replicas
    of an object cache in seed peers.\n  maxReplicas: 3\n  # Object storage service
    security option.\n  security:\n    insecure: true\n    tlsVerify: true\n  tcpListen:\n
    \   # # Listen address.\n    # listen: 0.0.0.0\n    # Listen port.\n    port:
    65004\n\n# peer task storage option\nstorage:\n  # task data expire time\n  #
    when there is no access to a task data, this task will be gc.\n  taskExpireTime:
    24h\n  # storage strategy when process task data\n  # io.d7y.storage.v2.simple
    : download file to data directory first, then copy to output path, this is default
    action\n  #                           the download file in date directory will
    be the peer data for uploading to other peers\n  # io.d7y.storage.v2.advance:
    download file directly to output path with postfix, hard link to final output,\n
    \ #                            avoid copy to output path, fast than simple strategy,
    but:\n  #                            the output file with postfix will be the
    peer data for uploading to other peers\n  #                            when user
    delete or change this file, this peer data will be corrupted\n  # default is io.d7y.storage.v2.simple\n
    \ strategy: io.d7y.storage.v2.simple\n  # disk quota gc threshold, when the quota
    of all tasks exceeds the gc threshold, the oldest tasks will be reclaimed.\n  diskGCThreshold:
    450Gi\n  # disk used percent gc threshold, when the disk used percent exceeds,
    the oldest tasks will be reclaimed.\n  # eg, diskGCThresholdPercent=80, when the
    disk usage is above 80%, start to gc the oldest tasks\n  diskGCThresholdPercent:
    90\n  # set to ture for reusing underlying storage for same task id\n  multiplex:
    true\n\n# Health service option.\nhealth:\n  security:\n    insecure: true\n    cacert:
    ''\n    cert: ''\n    key: ''\n    tlsVerify: false\n  tcpListen:\n    # # Listen
    address.\n    # listen: 0.0.0.0\n    # Listen port, daemon will try to listen,\n
    \   # when this port is not available, daemon will try next port.\n    port: 40901\n
    \   # If want to limit upper port, please use blow format.\n#   port:\n#     start:
    40901\n#     end: 40901\n\n# proxy service detail option\nproxy:\n  # filter for
    hash url\n  # when defaultFilter: \"Expires&Signature&ns\", for example:\n  #
    \ http://localhost/xyz?Expires=111&Signature=222&ns=docker.io and http://localhost/xyz?Expires=333&Signature=999&ns=docker.io\n
    \ # is same task\n  defaultFilter: \"response-content-disposition&AWSAccessKeyId&Signature&Expires\"\n
    \ # Tag the task.\n  # when the value of the default tag is different,\n  # the
    same download url can be divided into different tasks according to the tag,\n
    \ # it is also possible to override the default tag by adding\n  # the X-Dragonfly-Tag
    header through the proxy.\n  defaultTag: ''\n  security:\n    insecure: true\n
    \   cacert: ''\n    cert: ''\n    key: ''\n    tlsVerify: false\n  tcpListen:\n
    \   # namespace stands the linux net namespace, like /proc/1/ns/net.\n    # It's
    useful for running daemon in pod with ip allocated and listening the special port
    in host net namespace.\n    # Linux only.\n    namespace: ''\n    # # Listen address.\n
    \   # listen: 0.0.0.0\n    # Listen port, daemon will try to listen,\n    # when
    this port is not available, daemon will try next port.\n    port: 65001\n    #
    If want to limit upper port, please use blow format.\n  #   port:\n  #     start:
    65020\n  #     end: 65029\n  registryMirror:\n    # when enable, using header
    \"X-Dragonfly-Registry\" for remote instead of url\n    dynamic: true\n    # url
    for the registry mirror\n    url: https://index.docker.io\n    # whether to ignore
    https certificate errors\n    insecure: true\n    # optional certificates if the
    remote server uses self-signed certificates\n    certs: []\n    # whether to request
    the remote registry directly\n    direct: false\n    # whether to use proxies
    to decide if dragonfly should be used\n    useProxies: false\n\n  proxies:\n    #
    Proxy all http image layer download requests with dfget.\n    # NOTE(tommylikehu):
    默认代理的文件, 这个是按照lfs的逻辑严格匹配的，类似于http://foundation-model-china3.test.osinfra.cn/lfs/25/38/ab1d84c573fe65dc2b6418e6ec24d284ee1f6c10cd58295a5bf9bd66456d?xxxx\n
    \   - regx: /lfs/\\w{2}/\\w{2}/\\w{60}\\?\n\n  hijackHTTPS:\n    # key pair used
    to hijack https requests\n    cert: \"\"\n    key: \"\"\n    hosts:\n      - regx:
    mirror.aliyuncs.com:443 # regexp to match request hosts\n        # whether to
    ignore https certificate errors\n        insecure: true\n        # optional certificates
    if the host uses self-signed certificates\n        certs: []\n  # max tasks to
    download same time, 0 is no limit\n  maxConcurrency: 0\n  whiteList:\n    # the
    host of the whitelist\n    - host: \"\"\n      # match whitelist hosts\n      regx:
    \".*\"\n      # port that need to be added to the whitelist\n      ports:\n\nnetwork:\n
    \ # Enable ipv6.\n  enableIPv6: false\n"
kind: ConfigMap
metadata:
  annotations:
    email: tommylikehu@gmail.com
  labels:
    owner: tommylike
  name: dragonfly-config
  namespace: dragonfly-cache
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    email: tommylikehu@gmail.com
  labels:
    owner: tommylike
  name: dragonfly-cache-peer1-service
  namespace: dragonfly-cache
spec:
  ports:
  - name: proxy-service
    port: 65001
    protocol: TCP
    targetPort: 65001
  selector:
    component: dragonfly-cache
    instance: dragonfly-cache-peer1
    owner: tommylike

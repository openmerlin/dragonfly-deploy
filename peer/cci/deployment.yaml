apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    email: tommylikehu@gmail.com
  labels:
    owner: tommylike
  name: dragonfly-cache-deployment-1
  namespace: dragonfly-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      component: dragonfly-cache
      instance: dragonfly-cache-peer1
      owner: tommylike
  template:
    metadata:
      annotations:
        email: tommylikehu@gmail.com
      labels:
        component: dragonfly-cache
        instance: dragonfly-cache-peer1
        owner: tommylike
    spec:
      containers:
      - command:
        - /opt/dragonfly/bin/dfget
        - daemon
        - --config
        - /data2/peer/peer.yaml
        image: swr.cn-southwest-2.myhuaweicloud.com/modelinfra/dfdaemon:v2.1.32
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - /bin/grpc_health_probe
            - -addr=:65000
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
        name: dragonfly-cache-server
        ports:
        - containerPort: 65000
          name: download-port
          protocol: TCP
        - containerPort: 65001
          name: proxy-port
          protocol: TCP
        - containerPort: 65002
          name: upload-port
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/grpc_health_probe
            - -addr=:65000
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - mountPath: /data2/peer
          name: database-volume
      initContainers:
      - command:
        - /bin/sh
        - -c
        - |
          # copy file into data volume and replace with real ip address
          cp /var/dragonfly/peer.yaml /data2/peer/peer.yaml
          sed -i "s^_REPLACE_ME_WIATH_REAL_IP_ADDRESS_^$DRAGONFLY_CACHE_POD_IP^g" /data2/peer/peer.yaml
        env:
        - name: DRAGONFLY_CACHE_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: swr.cn-southwest-2.myhuaweicloud.com/modelinfra/alpine:3.19.1
        name: config-update
        volumeMounts:
        - mountPath: /var/dragonfly/peer.yaml
          name: config-volume
          subPath: peer.yaml
        - mountPath: /data2/peer
          name: database-volume
      volumes:
      - configMap:
          name: dragonfly-config
        name: config-volume
      - name: database-volume
        persistentVolumeClaim:
          claimName: cci-evs-dragonfly-cache-volume-1
---
